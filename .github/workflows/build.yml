name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project zip (if present)
        run: |
          z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -1)
          if [ -n "$z" ] && [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            echo "Unzipping $z"
            unzip -q "$z" -d unpacked
          fi

      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          ls -la "$d" "$d/app"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Gradle 8.9
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip && break
            echo "retry $i"; sleep 15
          done
          if [ -s /tmp/gradle.zip ]; then
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
          else
            echo "download failed, using runner's Gradle"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Rename APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk THEP-RC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: THEP-RC-apk
          path: ${{ steps.loc.outputs.dir }}/THEP-RC.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.loc.outputs.dir }}/THEP-RC.apk
