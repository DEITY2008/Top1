name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Gradle 8.9
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip && break
            echo "retry $i"; sleep 15
          done
          if [ -s gradle.zip ]; then
            unzip -q gradle.zip -d "$HOME"
            echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
          else
            echo "download failed, using runner's Gradle"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk THEP-RC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: THEP-RC-apk
          path: THEP-RC.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: THEP-RC.apk
